<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گروه پرس | سامانه بازرسی تجهیزات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1017; --bg2:#111722; --panel:#161e2b; --panel2:#1b2534;
    --line:#26334a; --txt:#e8eef8; --muted:#93a3ba;
    --amber:#f5a524; --ok:#2ecc71; --warn:#f0b429; --bad:#ef5350; --info:#4aa8ff;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, #1d2a3d 0%, transparent 60%),
      radial-gradient(900px 500px at 5% 0%, #24301f 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
    min-height:100vh; font-size:15px; line-height:1.7;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

  header.top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 16px;margin-bottom:18px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
    border:1px solid var(--line);border-radius:18px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:46px;height:46px;flex:0 0 46px;border-radius:12px;
    background:linear-gradient(145deg,var(--amber),#e0821a);
    display:grid;place-items:center;color:#20160a;font-weight:700;font-size:22px;
    box-shadow:0 6px 16px rgba(245,165,36,.25);
  }
  .logo.word{font-size:12px;letter-spacing:1.2px}
  .logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
  .brand h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
  .brand p{margin:0;font-size:12px;color:var(--muted)}

  .userbox{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .userbox .who{text-align:left;font-size:12px;color:var(--muted);line-height:1.4}
  .userbox .who b{display:block;color:var(--txt);font-size:13px;font-weight:500}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#22304a;border:1px solid var(--line)}
  .avatar.ph{display:grid;place-items:center;color:var(--muted);font-size:14px}
  .clock{font-size:12px;color:var(--muted);text-align:left}

  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  nav.tabs button{
    font:inherit;font-size:14px;padding:9px 16px;border-radius:11px;cursor:pointer;
    background:var(--panel);color:var(--muted);border:1px solid var(--line);
    transition:.15s;display:flex;align-items:center;gap:7px;
  }
  nav.tabs button:hover{color:var(--txt);border-color:#35486a}
  nav.tabs button.active{
    background:linear-gradient(180deg,#22314a,#1a2434);
    color:#fff;border-color:var(--amber);box-shadow:0 0 0 1px rgba(245,165,36,.25) inset;
  }

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .kpi{
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;
  }
  .kpi:before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--muted);opacity:.8}
  .kpi.ok:before{background:var(--ok)} .kpi.warn:before{background:var(--warn)}
  .kpi.bad:before{background:var(--bad)} .kpi.amber:before{background:var(--amber)}
  .kpi .n{font-size:26px;font-weight:700;line-height:1.2}
  .kpi .l{font-size:12px;color:var(--muted)}

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px;
  }
  .panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
  .panel h2 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:auto}
  .panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:660px}
  th{
    text-align:right;font-weight:500;color:var(--muted);font-size:12px;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:11px 10px;border-bottom:1px solid rgba(38,51,74,.6);vertical-align:middle}
  tr:hover td{background:rgba(255,255,255,.02)}
  td.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--amber);white-space:nowrap}
  .eq-name{font-weight:500}
  .eq-sub{font-size:11.5px;color:var(--muted)}

  .badge{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;
    border:1px solid transparent;white-space:nowrap;font-weight:500;
  }
  .b-ok{background:rgba(46,204,113,.13);color:#5ee397;border-color:rgba(46,204,113,.3)}
  .b-warn{background:rgba(240,180,41,.13);color:#f3c65c;border-color:rgba(240,180,41,.3)}
  .b-bad{background:rgba(239,83,80,.13);color:#ff8b88;border-color:rgba(239,83,80,.32)}
  .b-none{background:rgba(147,163,186,.12);color:#a9b7cb;border-color:rgba(147,163,186,.28)}
  .b-info{background:rgba(74,168,255,.13);color:#84c3ff;border-color:rgba(74,168,255,.3)}

  .btn{
    font:inherit;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#3d5478;background:#223047}
  .btn.primary{
    background:linear-gradient(180deg,var(--amber),#dc8c14);color:#221703;
    border-color:#e9a234;font-weight:700;
  }
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{font-size:12px;padding:6px 11px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .inline{display:inline;margin:0}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number],input[type=search],input[type=password],input[type=url],select,textarea{
    width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;
    background:#0e141d;border:1px solid var(--line);color:var(--txt);outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.12)}
  textarea{resize:vertical;min-height:74px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .search{max-width:280px}

  .chk{display:flex;flex-direction:column;gap:8px}
  .chk-item{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0f151f;
  }
  .chk-item .t{flex:1 1 240px;font-size:13.5px}
  .chk-item .t .num{color:var(--amber);font-size:11.5px;margin-inline-end:6px}
  .seg{display:flex;gap:4px;flex:0 0 auto}
  .seg label{
    font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);color:var(--muted);background:#131b26;user-select:none;
  }
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input[value=ok]:checked){background:rgba(46,204,113,.16);border-color:var(--ok);color:#7ff0ae}
  .seg label:has(input[value=fail]:checked){background:rgba(239,83,80,.16);border-color:var(--bad);color:#ffa3a1}
  .seg label:has(input[value=na]:checked){background:rgba(147,163,186,.16);border-color:#7a8aa0;color:#cdd7e4}
  .chk-item.flagged{border-color:rgba(239,83,80,.5);background:rgba(239,83,80,.05)}

  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .qr-card{
    background:#f7f9fc;color:#101820;border-radius:14px;padding:12px;text-align:center;
    border:1px solid #dbe3ee;
  }
  .qr-card .box{background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center;min-height:150px}
  .qr-card .box svg{width:100%;height:auto;max-width:160px;display:block}
  .qr-card .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:14px;margin-top:8px;letter-spacing:.5px}
  .qr-card .nm{font-size:11.5px;color:#4b586b;line-height:1.5}
  .qr-card .fallback{font-size:10.5px;color:#8a94a6;word-break:break-all;padding:8px}

  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px}
  .notice{
    padding:12px 14px;border-radius:12px;font-size:13px;
    background:rgba(74,168,255,.08);border:1px solid rgba(74,168,255,.25);color:#bfd8f5;
  }
  .notice.good{background:rgba(46,204,113,.08);border-color:rgba(46,204,113,.3);color:#bdf3d3}
  .notice.warn{background:rgba(240,180,41,.08);border-color:rgba(240,180,41,.3);color:#f6dfa8}
  .mount{font-size:11.5px;color:var(--muted);margin-top:8px}
  .detail-row td{background:#0d131c !important}
  .detail-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none}
  .detail-list li{font-size:11.5px;padding:3px 9px;border-radius:7px;background:rgba(239,83,80,.12);color:#ffa3a1;border:1px solid rgba(239,83,80,.28)}
  .footnote{font-size:11.5px;color:#6f7f95;text-align:center;margin-top:26px;line-height:2}

  /* ================= قالب شیشه‌ای ================= */
  body{
    background:
      radial-gradient(900px 520px at 88% -8%, rgba(245,165,36,.20), transparent 62%),
      radial-gradient(820px 480px at 4% 2%, rgba(74,168,255,.18), transparent 58%),
      radial-gradient(900px 620px at 50% 108%, rgba(46,204,113,.10), transparent 60%),
      linear-gradient(165deg,#080c12,#0c131d 45%,#080c12);
    background-attachment:fixed;
  }
  header.top,nav.tabs,.panel,.kpi,.chk-item,.authcard{
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    backdrop-filter:blur(16px) saturate(150%);
  }
  header.top{
    background:linear-gradient(170deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 45px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .logo{
    background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.30);color:#ffd99a;
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  nav.tabs{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:8px;gap:6px}
  nav.tabs button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#b9c6d8}
  nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.22)}
  nav.tabs button.active{
    background:linear-gradient(170deg,rgba(245,165,36,.34),rgba(245,165,36,.14));
    border-color:rgba(245,165,36,.55);color:#fff;
    box-shadow:0 10px 24px rgba(245,165,36,.22), inset 0 1px 0 rgba(255,255,255,.30);
  }
  .panel{
    background:linear-gradient(170deg,rgba(255,255,255,.085),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.14);border-radius:20px;
    box-shadow:0 20px 48px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .kpi{
    background:linear-gradient(170deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 14px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .kpi:before{width:3px;opacity:1}
  .chk-item{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12)}
  .btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)}
  .btn.primary{
    background:linear-gradient(170deg,#ffc251,#e89412);border-color:rgba(255,214,140,.55);color:#221703;
    box-shadow:0 10px 24px rgba(245,165,36,.28), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn.primary:hover{background:linear-gradient(170deg,#ffcf70,#f09c17)}
  .seg label{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
  input[type=text],input[type=number],input[type=search],input[type=password],input[type=url],select,textarea{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:12px;
  }
  th{border-bottom:1px solid rgba(255,255,255,.12)}
  td{border-bottom:1px solid rgba(255,255,255,.07)}
  .avatar{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}

  .glass-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:14px;margin-bottom:14px}
  .chart-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:12px}
  .chart-box svg{width:100%;height:auto;display:block}
  .chart-title{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .charts{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:16px}
  @media (max-width:760px){.charts{grid-template-columns:1fr}}

  .test-q{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:10px}
  .test-q .qt{font-size:13.5px;margin-bottom:10px;line-height:1.9}
  .test-q .cat{font-size:10.5px;color:#ffd08a;background:rgba(245,165,36,.14);border:1px solid rgba(245,165,36,.3);padding:2px 8px;border-radius:999px;margin-inline-end:8px}
  .opt{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .opt:hover{background:rgba(255,255,255,.07)}
  .opt input{margin-top:5px}
  .opt:has(input:checked){background:rgba(245,165,36,.16);border-color:rgba(245,165,36,.45)}

  @media print{
    body{background:#fff !important;color:#000}
    header.top,nav.tabs,.no-print{display:none !important}
    .panel,.kpi,.glass-box,.chart-box,.chk-item{background:#fff !important;border:1px solid #ccc !important;box-shadow:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
    .charts{grid-template-columns:1fr 1fr}
  }

  .authcard{max-width:520px;margin:6vh auto;text-align:center;padding:34px 26px}
  .authcard .big{font-size:44px;line-height:1;margin-bottom:14px}
  .authcard h2{justify-content:center;font-size:19px;margin-bottom:10px}
  .authcard p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .authcard .btn{font-size:15px;padding:12px 24px}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 10px;color:var(--muted);font-size:14px}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:620px){
    .grid2{grid-template-columns:1fr}
    .brand h1{font-size:15px;white-space:nowrap}
    .clock{display:none}
    .chk-item .t{flex:1 1 100%}
    .userbox .who{font-size:11px}
    .userbox .ucode{display:none}
    #inspect-form .btn{width:100%;justify-content:center}
    header.top{padding:12px 14px}
    .charts{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff;color:#000}
    header.top,nav.tabs,.no-print,.footnote{display:none !important}
    .panel{border:none;background:#fff;padding:0}
    .qr-grid{grid-template-columns:repeat(3,1fr);gap:10px}
    .qr-card{border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
    .wrap{padding:0;max-width:none}
    .print-head{display:block !important;margin-bottom:14px}
  }
  .print-head{display:none;font-size:14px;font-weight:700;margin-bottom:10px}

  /* ============ منوی کناری شیشه‌ای ============ */
  .wrap{
    display:grid;grid-template-columns:216px minmax(0,1fr);
    grid-template-areas:"head head" "side main" "foot foot";
    gap:16px 18px;align-items:start;max-width:1300px;
  }
  header.top{grid-area:head;width:100%;margin-bottom:0}
  nav.tabs{grid-area:side}
  main#app{grid-area:main;min-width:0}
  .footnote{grid-area:foot}
  .kpi.link{cursor:pointer;transition:transform .2s ease, box-shadow .25s ease, border-color .2s ease}
  .kpi.link:hover{transform:translateY(-3px);border-color:rgba(245,165,36,.45);box-shadow:0 18px 38px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.22)}
  .kpi.link:active{transform:translateY(-1px) scale(.995)}
  .kpi.link:focus-visible{outline:2px solid rgba(245,165,36,.7);outline-offset:2px}
  .wrap.no-sidebar{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "foot"}

  nav.tabs{
    position:sticky;top:16px;display:flex;flex-direction:column;flex-wrap:nowrap;gap:6px;
    margin-bottom:0;padding:12px 10px;border-radius:22px;overflow:hidden;isolation:isolate;z-index:20;
    background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 22px 50px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  }
  nav.tabs:before{
    content:'';position:absolute;inset:-40% -60%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(closest-side at 30% 20%, rgba(245,165,36,.38), transparent 70%),
      radial-gradient(closest-side at 70% 80%, rgba(74,168,255,.30), transparent 70%);
    background-size:190% 190%;
    animation:sideGlow 15s ease-in-out infinite alternate;
    opacity:.6;filter:blur(6px);
  }
  @keyframes sideGlow{from{background-position:0% 0%}to{background-position:100% 100%}}
  nav.tabs .nav-title{
    font-size:10.5px;letter-spacing:.6px;color:rgba(255,255,255,.45);
    padding:2px 6px 8px;margin-bottom:2px;
  }
  nav.tabs button{
    position:relative;width:100%;justify-content:flex-start;gap:10px;overflow:hidden;isolation:isolate;
    padding:11px 13px;border-radius:14px;font-size:13.5px;font-weight:500;color:#c4d1e2;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    transition:transform .22s cubic-bezier(.2,.9,.2,1), background .22s, border-color .22s, color .18s, box-shadow .25s;
    animation:navIn .5s cubic-bezier(.2,.9,.2,1) both;
  }
  nav.tabs button .ic{font-size:16px;line-height:1;transition:transform .25s ease;filter:saturate(1.1)}
  nav.tabs button .tx{white-space:nowrap}
  nav.tabs button:nth-of-type(1){animation-delay:.02s}
  nav.tabs button:nth-of-type(2){animation-delay:.07s}
  nav.tabs button:nth-of-type(3){animation-delay:.12s}
  nav.tabs button:nth-of-type(4){animation-delay:.17s}
  nav.tabs button:nth-of-type(5){animation-delay:.22s}
  nav.tabs button:nth-of-type(6){animation-delay:.27s}
  nav.tabs button:nth-of-type(7){animation-delay:.32s}
  nav.tabs button:nth-of-type(8){animation-delay:.37s}
  @keyframes navIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  nav.tabs button:before{
    content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.20) 46%,transparent 72%);
    transform:translateX(-130%);transition:transform .75s ease;
  }
  nav.tabs button:hover{
    transform:translateX(-4px);color:#fff;background:rgba(255,255,255,.11);
    border-color:rgba(255,255,255,.28);box-shadow:0 12px 26px rgba(0,0,0,.38);
  }
  nav.tabs button:hover:before{transform:translateX(130%)}
  nav.tabs button:hover .ic{transform:scale(1.18) rotate(-7deg)}
  nav.tabs button:active{transform:translateX(-1px) scale(.985)}

<script>
/* =========================================================
   رابط کاربری: داده‌ها از API مرکزی (D1) خوانده و ذخیره می‌شوند
   ========================================================= */
const DAY = 86400000;
const CHECK_ITEMS_LABELS = [
  'ترمز پا، ترمز دستی و عملکرد توقف',
  'فرمان، بوق و سیستم هیدرولیک',
  'نشتی روغن یا مایع هیدرولیک در زیر تجهیز',
  'چراغ‌های هشدار، چراغ گردان و بوق دنده عقب',
  'کمربند ایمنی، صندلی و حفاظ اپراتور',
  'سطح روغن موتور / شارژ باتری (در تجهیز برقی)',
  'لاستیک‌ها، چرخ‌ها و پیچ‌های محور',
  'دوشاخه (فورک)، زنجیر بالابر و کشش زنجیر',
  'دکل، ریل‌ها، غلطک‌ها و مهارهای جانبی',
  'سیستم روشنایی، آینه‌ها و دید راننده',
  'کپسول آتش‌نشانی و تجهیزات ایمنی همراه',
  'برچسب ظرفیت مجاز و پلاک شناسایی تجهیز',
  'کنتور ساعت‌کار و کارکرد سالم آن',
  'نظافت عمومی، کابین و نبود اشیای شل'
];
// چک‌لیست فعال از دیتابیس می‌آید؛ این متغیر با هر بار بارگذاری داده به‌روز می‌شود.
let CHECKLIST = CHECK_ITEMS_LABELS.slice();

function scrollToEl(el){
  try{
    if(el && typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'smooth', block:'center'});
  }catch(e){}
}

function itemsOf(rec){
  return (rec && Array.isArray(rec.items) && rec.items.length) ? rec.items : CHECK_ITEMS_LABELS;
}

const TYPES = {
  forklift:     { label:'لیفتراک',    icon:'🚜' },
  reachstacker: { label:'ریچ استاکر', icon:'🏗' },
  transtainer:  { label:'ترانستینر',  icon:'🚢' }
};
const SHIFTS = ['صبح','عصر','شب'];

/* ---------------- نقش‌ها ---------------- */
const ROLES = {
  manager:  { label:'مدیر',    cls:'b-ok' },
  operator: { label:'اپراتور', cls:'b-info' }
};

const TABS = [
  { view:'dashboard', label:'📊 داشبورد', managerOnly:true },

  { view:'qr',        label:'📱 کد QR',    managerOnly:true },
  { view:'settings',  label:'⚙️ تنظیمات',  managerOnly:true }
];

function isManager(){ return !!(USER && USER.role === 'manager'); }
function roleInfo(role){ return ROLES[role] || { label:'بدون نقش', cls:'b-none' }; }
function canSee(view){
  if(!USER) return false;
  if(isManager()) return true;
  return view === 'inspect' || view === 'done' || view === 'test';
}

/* ---------------- state ---------------- */
let DB = { equipment:[], inspections:[], users:[], online:[], guides:{}, checklist:[], tests:[], logins:[], test:{ questions:[], last:null, valid:false, minScore:60, validHours:12 } };

let heartbeat = null;
function startHeartbeat(){
  if(heartbeat) return;
  heartbeat = setInterval(()=>{
    if(USER) api('/api/ping', { method:'POST' }).catch(()=>{});
  }, 60000);
}

function jalaliNow(){
  try{
    const parts = new Intl.DateTimeFormat('en-u-ca-persian', { year:'numeric', month:'numeric' })
      .formatToParts(new Date());
    const pick = t => Number((parts.find(p=>p.type===t) || {}).value) || 0;
    return { jy: pick('year'), jm: pick('month') };
  }catch(e){
    return { jy:0, jm:0 };
  }
}
let USER = null;
let BOOT = { status:'loading', error:'' };

const state = { view:'dashboard', inspectEqId:null, q:'', eqQ:'', typeFilter:'', statusFilter:'', pendingEq:null, openRecord:null, lastResult:null, guideOk:{} };
const STATUS_LABELS = { ok:'در مهلت', soon:'نزدیک سررسید', overdue:'عقب‌افتاده', none:'بدون بازرسی', fail:'نیازمند تعمیر' };

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faDigit = s => String(s).replace(/[0-9]/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const jDate = iso => new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(iso));
const jTime = iso => new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };

const eqById = id => DB.equipment.find(e=>e.id===id);
const eqByCode = code => DB.equipment.find(e=>String(e.code).toLowerCase()===String(code||'').toLowerCase());
const lastInspection = eqId => DB.inspections.filter(i=>i.eqId===eqId).sort((a,b)=>b.at-a.at)[0] || null;
const inspectionsOf = eqId => DB.inspections.filter(i=>i.eqId===eqId).sort((a,b)=>b.at-a.at);

function dueDaysLeft(eq, last){
  const period = Number(eq.period)||30;
  return Math.round((startOfDay(last.at) + period*DAY - startOfDay(Date.now()))/DAY);
}
function dueDate(eq, last){
  const period = Number(eq.period)||30;
  return new Date(startOfDay(last.at) + period*DAY);
}
function statusOf(eq){
  const last = lastInspection(eq.id);
  if(!last) return { key:'none', label:'بدون بازرسی', cls:'b-none', last:null, daysLeft:null };
  const dl = dueDaysLeft(eq, last);
  if(last.result === 'fail') return { key:'fail', label:'نیازمند تعمیر', cls:'b-bad', last, daysLeft:dl };
  if(dl < 0) return { key:'overdue', label:'عقب‌افتاده', cls:'b-bad', last, daysLeft:dl };
  if(dl <= 3) return { key:'soon', label:'نزدیک سررسید', cls:'b-warn', last, daysLeft:dl };
  return { key:'ok', label:'در مهلت', cls:'b-ok', last, daysLeft:dl };
}

/* ---------------- API ---------------- */
async function api(path, options){
  const opts = options || {};
  const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {}, cache: 'no-store' };
  if(opts.body !== undefined){
    init.headers['content-type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  let timer = null;
  if(ctrl){
    init.signal = ctrl.signal;
    timer = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, opts.timeout || 25000);
  }
  let res;
  try{
    res = await fetch(path, init);
  }catch(e){
    const aborted = ctrl && ctrl.signal && ctrl.signal.aborted;
    const err = new Error(aborted
      ? 'پاسخ سرور دیر شد. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.'
      : 'ارتباط با سرور برقرار نشد. اتصال اینترنت را بررسی کنید.');
    err.network = true;
    throw err;
  }finally{
    if(timer) clearTimeout(timer);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){
    USER = null;
    BOOT = { status:'signedout', error:'' };
    const err = new Error('نیاز به ورود مجدد');
    err.unauthorized = true;
    throw err;
  }
  if(!res.ok){
    const err = new Error((data && data.error) || ('خطای سرور (' + res.status + ')'));
    err.status = res.status;
    err.code = data && data.code;
    throw err;
  }
  return data;
}

async function bootstrap(){
  try{
    const jn = jalaliNow();
    const d = await api('/api/bootstrap?jm=' + (jn.jm||0) + '&jy=' + (jn.jy||0));
    USER = d.user || null;
    DB = {
      equipment: Array.isArray(d.equipment) ? d.equipment : [],
      inspections: Array.isArray(d.inspections) ? d.inspections : [],
      users: Array.isArray(d.users) ? d.users : [],
      online: Array.isArray(d.online) ? d.online : [],
      guides: d.guides && typeof d.guides === 'object' ? d.guides : {},
      checklist: Array.isArray(d.checklist) ? d.checklist : []
    };
    DB.tests = Array.isArray(d.tests) ? d.tests : [];
    DB.logins = Array.isArray(d.logins) ? d.logins : [];
    DB.test = d.test || DB.test;
    CHECKLIST = DB.checklist.length ? DB.checklist.map(c=>c.label) : CHECK_ITEMS_LABELS.slice();
    startHeartbeat();
    BOOT = {
      status:'ready', error:'',
      configured: !!d.sheetsConfigured,
      logo: d.logo || '',
      unsynced: Number(d.unsynced || 0)
    };
  }catch(e){
    if(e.unauthorized){ /* view به صفحه ورود می‌رود */ }
    else { BOOT = { status:'error', error: e.message || 'خطای نامشخص' }; }
  }
  render();
}

/* ---------------- router ---------------- */
function show(view, eqId){
  if(!canSee(view)) view = isManager() ? 'dashboard' : 'inspect';
  state.view = view;
  // فقط وقتی شناسه تجهیز صریحاً داده شود، انتخاب عوض می‌شود (null = بازگشت به فهرست)
  if(view === 'inspect' && eqId !== undefined) state.inspectEqId = eqId || null;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  if(USER && BOOT.status === 'ready' && !canSee(state.view)){
    state.view = isManager() ? 'dashboard' : 'inspect';
  }
  renderUserBox();
  renderNav();
  const logoBox = $('#brand-logo');
  if(logoBox) logoBox.innerHTML = BOOT.logo ? `<img src="${esc(BOOT.logo)}" alt="لوگوی شرکت">` : 'PERS';
  const app = $('#app');
  if(BOOT.status === 'loading'){
    app.innerHTML = `<div class="loading"><span class="spin"></span> در حال بارگذاری داده‌های مرکزی…</div>`;
    return;
  }
  if(BOOT.status === 'setup'){ app.innerHTML = viewSetup(); return; }
  if(BOOT.status === 'signedout'){ app.innerHTML = viewSignedOut(); return; }
  if(BOOT.status === 'error'){ app.innerHTML = viewError(BOOT.error); return; }

  if(state.view==='dashboard') app.innerHTML = viewDashboard();
  else if(state.view==='inspect') app.innerHTML = viewInspect();
  else if(state.view==='equipment') app.innerHTML = viewEquipment();
  else if(state.view==='history') app.innerHTML = viewHistory();
  else if(state.view==='qr') app.innerHTML = viewQR();
  else if(state.view==='test') app.innerHTML = viewTest();
  else if(state.view==='settings') app.innerHTML = viewSettings();
  else if(state.view==='done') app.innerHTML = viewDone();

  if(state.view==='qr') drawQRCodes();
  if(state.view==='inspect'){ bindInspect(); bindGuide(); }
}

function renderNav(){
  const nav = $('#tabs');
  if(!nav) return;
  const wrap = document.querySelector('.wrap');

  nav.style.display = '';
  nav.innerHTML = '<div class="nav-title">منوی اصلی</div>' + TABS
    .filter(t=> !t.managerOnly || isManager())
    .map(t=>{
      const sp = t.label.indexOf(' ');

    })
    .join('');
}

function viewDashboard(){
  const eqs = DB.equipment.filter(e=>e.active!==false);
  const rows = eqs.map(e=>({ e, st: statusOf(e) }));
  const count = k => rows.filter(r=>r.st.key===k).length;
  const today = startOfDay(Date.now());
  const todayCount = DB.inspections.filter(i=>startOfDay(i.at)===today).length;

  const q = state.q.trim().toLowerCase();
  const filtered = rows.filter(r => !q ||
    ((r.e.code||'')+' '+(r.e.name||'')+' '+(r.e.site||'')+' '+(r.e.model||'')).toLowerCase().includes(q));

  const alerts = rows.filter(r=>['overdue','fail','none','soon'].includes(r.st.key))
    .sort((a,b)=>{ const rank={fail:0,none:1,overdue:2,soon:3}; return rank[a.st.key]-rank[b.st.key]; });

function trendChart(){
  const now = new Date();
  const months = [];
  for(let k=5;k>=0;k--){
    const d = new Date(now.getFullYear(), now.getMonth()-k, 1);
    months.push({
      y:d.getFullYear(), m:d.getMonth(),
      label:new Intl.DateTimeFormat('fa-IR',{month:'long'}).format(d),
      n:0
    });
  }
  DB.inspections.forEach(r=>{
    const d = new Date(r.at);
    const hit = months.find(x=>x.y===d.getFullYear() && x.m===d.getMonth());
    if(hit) hit.n++;
  });
  const max = Math.max(1, ...months.map(m=>m.n));
  const w = 640, h = 190, pad = 24, bw = (w - pad*2) / months.length;
  const bars = months.map((m,i)=>{
    const bh = (m.n / max) * (h - 66);
    const x = pad + i*bw + bw*0.2;
    const y = h - 34 - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.6).toFixed(1)}" height="${Math.max(3,bh).toFixed(1)}" rx="6" fill="url(#gradBar)"></rect>
      <text x="${(x+bw*0.3).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="11" fill="#dfe7f2">${faDigit(m.n)}</text>
      <text x="${(x+bw*0.3).toFixed(1)}" y="${h-12}" text-anchor="middle" font-size="11" fill="#93a3ba">${esc(m.label)}</text>`;
  }).join('');
  return `<div class="chart-box" style="background:transparent;border:none;padding:0">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="gradBar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc251"/><stop offset="1" stop-color="#e89412"/>
      </linearGradient></defs>
      ${bars}
    </svg></div>`;
}

function defectsChart(){
  const counts = new Map();
  DB.inspections.forEach(r=>{
    const labels = itemsOf(r);
    (r.fails||[]).forEach(i=>{
      const l = labels[i];
      if(l) counts.set(l, (counts.get(l)||0)+1);
    });
  });
  const top = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,7);
  if(!top.length) return `<div class="empty" style="padding:24px 6px">هنوز ایرادی ثبت نشده است.</div>`;
  const max = top[0][1];
  return `<div style="display:flex;flex-direction:column;gap:9px">
    ${top.map(([label,n])=>`
      <div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px">
          <span>${esc(label)}</span><span style="color:#ffd08a;font-weight:700">${faDigit(n)}</span>
        </div>
        <div style="height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px">
          <div style="height:100%;width:${Math.round(n/max*100)}%;background:linear-gradient(90deg,#ffc251,#e89412);border-radius:999px"></div>
        </div>
      </div>`).join('')}
  </div>`;
}

function managerTables(){
  const ops = new Map();
  DB.inspections.forEach(r=>{
    const key = r.operator || '—';
    const cur = ops.get(key) || { name:key, n:0, fails:0, last:0 };
    cur.n++; if(r.result==='fail') cur.fails++; cur.last = Math.max(cur.last, r.at);
    ops.set(key, cur);
  });
  const testByCode = new Map();
  (DB.tests||[]).forEach(t=>{ if(!testByCode.has(t.userCode)) testByCode.set(t.userCode, t); });
  const rows = [...ops.values()].sort((a,b)=>b.n-a.n);

  const opsTable = rows.length ? `<div class="scroll"><table style="min-width:620px">
    <thead><tr><th>اپراتور</th><th>تعداد بازرسی</th><th>نرخ سالم</th><th>آخرین بازرسی</th><th></th></tr></thead>
    <tbody>${rows.map(o=>`<tr>
      <td>${esc(o.name)}</td>
      <td>${faDigit(o.n)}</td>
      <td>${faDigit(Math.round((o.n-o.fails)/o.n*100))}٪</td>
      <td>${jDate(o.last)}</td>
      <td><button class="btn sm ghost" data-act="del-op" data-name="${esc(o.name)}" title="حذف همه‌ی بازرسی‌های این اپراتور">🗑 حذف</button></td>
    </tr>`).join('')}</tbody>
  </table></div>` : `<div class="empty">هنوز بازرسی‌ای ثبت نشده است.</div>`;

  const tests = (DB.tests||[]).slice(0,10);
  const testTable = tests.length ? `<div class="scroll"><table style="min-width:560px">
    <thead><tr><th>نام</th><th>تاریخ</th><th>نمره</th><th>نتیجه</th><th>تخصصی</th><th>ایمنی</th><th>رفتاری</th><th></th></tr></thead>
    <tbody>${tests.map(t=>{
      const c = t.cats || {};
      const pct = k => (c[k] && c[k][1]) ? faDigit(c[k][0]) + '/' + faDigit(c[k][1]) : '—';
      const cls = t.band==='قبول' ? 'b-ok' : t.band==='مشروط' ? 'b-warn' : 'b-bad';
      return `<tr>
        <td>${esc(t.userName||t.userCode)}</td>
        <td>${jDate(t.at)}</td>
        <td style="color:#ffd08a;font-weight:700">${faDigit(t.score)}٪</td>
        <td><span class="badge ${cls}">${esc(t.band)}</span></td>
        <td class="eq-sub">${pct('technical')}</td>
        <td class="eq-sub">${pct('safety')}</td>
        <td class="eq-sub">${pct('psych')}</td>
        <td><button class="btn sm ghost" data-act="del-test" data-id="${esc(t.id)}" title="حذف این نتیجه آزمون">🗑</button></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>` : `<div class="empty">هنوز آزمونی ثبت نشده است.</div>`;

  return `
  <div class="charts" style="grid-template-columns:1fr 1fr">
    <div class="panel" style="margin:0">
      <h2>👷 عملکرد اپراتورها <span class="sub">${faDigit(rows.length)} نفر</span></h2>
      ${opsTable}

      ${testTable}

function viewTest(){

  const head = `

      ${last
        ? `<div class="notice ${t.valid?'good':'warn'}">آخرین آزمون شما: ${jDate(last.at)} ساعت ${jTime(last.at)} — نمره ${faDigit(last.score)}٪ (${esc(last.band)}). ${t.valid?'نتیجه معتبر است.':'نتیجه معتبر نیست؛ آزمون را دوباره بدهید.'}</div>`

      ${res ? `<div class="notice ${res.score>= (t.minScore||60)?'good':'warn'}" style="margin-top:10px">
        نتیجهٔ همین آزمون: ${faDigit(res.correct)} پاسخ درست از ${faDigit(res.total)} — نمره ${faDigit(res.score)}٪ (${esc(res.band)})

function viewInspect(){
  const all = DB.equipment.filter(e=>e.active!==false);
  if(!all.length){
    return `<div class="panel"><div class="empty">هنوز تجهیزی ثبت نشده است. ابتدا از بخش «تجهیزات» تجهیز اضافه کنید.</div></div>`;
  }
  const eq = state.inspectEqId ? eqById(state.inspectEqId) : null;

  if(!eq){
    const q = (state.eqQ || '').trim().toLowerCase();
    const tf = state.typeFilter || '';
    const shown = all.filter(e => (!tf || e.type === tf) && (!q ||
      ((e.code||'') + ' ' + (e.name||'') + ' ' + (e.site||'')).toLowerCase().includes(q)));
    const typeChips = ['transtainer','reachstacker','forklift']
      .filter(t=>all.some(e=>e.type===t))
      .map(t=>`<button class="btn sm ${tf===t?'primary':''}" data-act="filter-eq" data-type="${t}">${TYPES[t].icon} ${TYPES[t].label}</button>`)
      .join('');
    const counts = ['transtainer','reachstacker','forklift']
      .map(t=>({ t, n: all.filter(e=>e.type===t).length }))
      .filter(x=>x.n>0)
      .map(x=>`${faDigit(x.n)} ${TYPES[x.t] ? TYPES[x.t].label : x.t}`)
      .join(' · ');
    return `
    <div class="panel">
      <h2>📝 شروع بازرسی <span class="sub">${counts}</span></h2>
      <p class="hint">تجهیز را جستجو و انتخاب کنید، یا کد QR روی بدنه دستگاه را اسکن کنید تا فرم خودکار باز شود.</p>
      <input type="search" id="eq-filter" class="search" style="max-width:none;margin-bottom:10px" placeholder="جستجوی کد یا نام تجهیز…" value="${esc(state.eqQ||'')}">

        <button class="btn sm ${tf?'':'primary'}" data-act="filter-eq" data-type="">همه دستگاه‌ها</button>
        ${typeChips}
      </div>
      <div class="grid3">
        ${shown.length ? shown.map(e=>{
          const st = statusOf(e);
          return `<div class="chk-item" style="flex-direction:column;align-items:stretch;gap:10px">
            <div style="display:flex;align-items:center;gap:8px">

              <div style="flex:1">

                <div class="eq-sub code">${esc(e.code)} · ${esc(e.site||'')}</div>

              <span class="badge ${st.cls}">${st.label}</span>

    </div>`;
  }

  const guideText = eqGuide(eq);
  if(guideText && !state.guideOk[eq.id]){
    return `

    <h2>📘 آموزش پیش از بازرسی <span class="sub">${TYPES[eq.type]?.icon||''} ${esc(eq.name)}</span></h2>

    <div class="glass-box" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:200px">
        <div class="eq-name" style="font-size:15px">${esc(eq.name)}</div>
        <div class="eq-sub">کد <span class="code">${esc(eq.code)}</span> · ${esc(eq.model||'')} · ${esc(eq.site||'')}</div>

    <label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin-top:16px;font-size:13.5px">

    </div>

    ${guideText ? `<details class="glass-box" style="margin-bottom:14px"><summary style="cursor:pointer;font-size:13.5px">📘 نمایش دوباره آموزش این تجهیز</summary><div style="white-space:pre-wrap;line-height:2;font-size:13px;margin-top:10px">${esc(guideText)}</div></details>` : ''}

    ${needTest ? `<div class="notice warn" style="margin-bottom:16px">برای ثبت بازرسی، ابتدا آزمون ارزیابی ۱۵ سوالی را با موفقیت انجام دهید. <button class="btn sm" data-act="to-test" style="margin-inline-start:8px">رفتن به آزمون</button></div>` : ''}

    <div class="glass-box">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <b style="font-size:13.5px">🗃 سابقه بازرسی این دستگاه</b>
        <span class="eq-sub">${hist.length ? 'شامل بازرسی ماه قبل' : 'ثبت نشده'}</span>
      </div>
      ${hist.length ? `<div class="scroll"><table style="min-width:520px">
        <thead><tr><th>تاریخ</th><th>نتیجه</th><th>اپراتور</th><th>موارد ایراد</th></tr></thead>
        <tbody>${hist.map(r=>{
          const labels = itemsOf(r);
          return `<tr>
            <td>${jDate(r.at)}<div class="eq-sub">${jTime(r.at)} · ${faDigit(Math.max(0,Math.round((startOfDay(Date.now())-startOfDay(r.at))/DAY)))} روز پیش</div></td>
            <td><span class="badge ${r.result==='pass'?'b-ok':'b-bad'}">${r.result==='pass'?'سالم':'نیازمند تعمیر'}</span></td>
            <td>${esc(r.operator)}</td>
            <td>${(r.fails||[]).length ? `<ul class="detail-list">${(r.fails||[]).map(i=>`<li>${esc(labels[i]||'')}</li>`).join('')}</ul>` : '<span class="eq-sub">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : `<div class="empty" style="padding:18px 6px">برای این دستگاه هنوز بازرسی ثبت نشده است؛ شما اولین نفر باشید.</div>`}
    </div>

    <form id="inspect-form" novalidate>
      <div class="grid3">
        <div class="field">
          <label for="operator">نام اپراتور *</label>
          <input type="text" id="operator" name="operator" placeholder="نام و نام خانوادگی" required value="${esc((USER && USER.name) || '')}">
        </div>
        <div class="field">
          <label for="shift">شیفت</label>
          <select id="shift" name="shift">${SHIFTS.map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label for="hours">کنتور ساعت‌کار</label>
          <input type="number" id="hours" name="hours" placeholder="مثلاً 2140" min="0" step="1">
        </div>
      </div>

      <div class="chk" id="chk">
        ${CHECKLIST.map((item,i)=>`
          <div class="chk-item" data-i="${i}">
            <div class="t"><span class="num">${faDigit(i+1)}.</span>${esc(item)}</div>
            <div class="seg">
              <label><input type="radio" name="chk_${i}" value="ok"><span>سالم</span></label>

            </div>

        <label for="notes">توضیحات / ایرادهای مشاهده‌شده</label>

      <div id="form-msg"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px" class="no-print">

        <button type="button" class="btn ghost" data-act="cancel-inspect">انصراف</button>
      </div>
      <p class="mount">با ثبت این فرم، بازرسی در دیتابیس مرکزی ذخیره و تاریخ بازرسی بعدی (دوره ${faDigit(eq.period)} روز) به‌روزرسانی می‌شود.</p>

function bindGuide(){
  const cb = $('#guide-check'), go = $('#guide-go');
  if(!cb || !go) return;
  cb.addEventListener('change', ()=>{ go.disabled = !cb.checked; });
}

function bindInspect(){
  const form = $('#inspect-form');
  if(!form) return;

  form.addEventListener('change', e=>{
    if(e.target.type==='radio'){
      const item = e.target.closest('.chk-item');
      item.classList.toggle('flagged', !!item.querySelector('input[value=fail]:checked'));
    }
  });

  form.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const eq = eqById(state.inspectEqId);
    if(!eq) return;
    const msg = $('#form-msg');
    const operator = form.elements['operator'].value.trim();

    if(!isManager() && !(DB.test && DB.test.valid)){
      msg.innerHTML = `<div class="notice warn">پیش از ثبت بازرسی، آزمون ارزیابی ۱۵ سوالی را انجام دهید. <button class="btn sm" data-act="to-test" style="margin-inline-start:8px">رفتن به آزمون</button></div>`;
      scrollToEl(msg);
      return;
    }

    if(!operator){
      msg.innerHTML = `<div class="notice warn">نام اپراتور را وارد کنید.</div>`;
      form.elements['operator'].focus();
      return;
    }

    const answers = [];
    const missing = [];
    CHECKLIST.forEach((_,i)=>{
      const sel = form.querySelector('input[name="chk_' + i + '"]:checked');
      if(!sel) missing.push(i+1);
      else answers.push({ i, v: sel.value });
    });
    if(missing.length){
      msg.innerHTML = `<div class="notice warn">${faDigit(missing.length)} مورد از چک‌لیست بی‌پاسخ مانده است (شماره ${faDigit(missing.slice(0,6).join('، '))}${missing.length>6?' …':''}).</div>`;
      const first = form.querySelector('.chk-item[data-i="' + (missing[0]-1) + '"]');
      scrollToEl(first);
      return;
    }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'در حال ثبت…';
    msg.innerHTML = '';

    try{
      const res = await api('/api/inspections', { method:'POST', body:{
        eqId: eq.id,
        operator,
        shift: form.elements['shift'].value,
        hours: form.elements['hours'].value === '' ? null : Number(form.elements['hours'].value),
        answers,
        notes: form.elements['notes'].value.trim(),
        dateFa: jDate(Date.now()),
        timeFa: jTime(Date.now())
      }});
      DB.inspections.unshift(res.inspection);
      state.lastResult = { rec: res.inspection, eq };
      state.view = 'done';
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){
      if(e.unauthorized){ render(); return; }
      if(e.code === 'TEST_REQUIRED'){
        msg.innerHTML = `<div class="notice warn">${esc(e.message)} <button class="btn sm" data-act="to-test" style="margin-inline-start:8px">رفتن به آزمون</button></div>`;
        btn.disabled = false;
        btn.textContent = '✔ ثبت بازرسی در داشبورد مرکزی';
        return;
      }
      msg.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
      btn.disabled = false;
      btn.textContent = '✔ ثبت بازرسی در داشبورد مرکزی';
    }
  });
}

function viewDone(){
  const lr = state.lastResult;
  if(!lr) return viewDashboard();
  const { rec, eq } = lr;
  const due = dueDate(eq, rec);
  const fails = (rec.fails||[]).map(i=>itemsOf(rec)[i]);
  return `
  <div class="panel">
    <h2>✅ بازرسی ثبت شد</h2>
    <div class="notice ${rec.result==='pass'?'good':'warn'}">
      ${rec.result==='pass'
        ? `بازرسی تجهیز <b>${esc(eq.code)}</b> بدون ایراد ثبت و در داشبورد مرکزی ذخیره شد.`
        : `بازرسی تجهیز <b>${esc(eq.code)}</b> با <b>${faDigit(fails.length)} ایراد</b> ثبت شد؛ تجهیز نیازمند تعمیر است.`}
    </div>
    <div class="grid3" style="margin-top:14px">
      <div class="kpi amber"><div class="n" style="font-size:18px">${esc(eq.name)}</div><div class="l">تجهیز بازرسی‌شده</div></div>
      <div class="kpi"><div class="n" style="font-size:18px">${jDate(rec.at)}</div><div class="l">تاریخ بازرسی — ساعت ${jTime(rec.at)}</div></div>
      <div class="kpi ok"><div class="n" style="font-size:18px">${jDate(due)}</div><div class="l">بازرسی بعدی</div></div>
      <div class="kpi"><div class="n" style="font-size:18px">${esc(rec.operator)}</div><div class="l">اپراتور — شیفت ${esc(rec.shift||'—')}</div></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" class="no-print">

      <button class="btn" data-act="go-inspect" data-code="${esc(eq.code)}">بازرسی مجدد همین تجهیز</button>
    </div>
  </div>`;
}

/* =========================================================
   خروجی CSV (اکسل)
   ========================================================= */
function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function downloadHistoryCSV(){
  const rows = [...DB.inspections].sort((a,b)=>b.at-a.at);
  if(!rows.length) return;

  const header = [
    'تاریخ بازرسی','ساعت','تاریخ و ساعت (ISO)','کد تجهیز','نام تجهیز','نوع',
    'محل','اپراتور','شیفت','کنتور ساعت‌کار','نتیجه','تعداد ایراد',
    'موارد دارای ایراد','توضیحات','ثبت‌کننده'
  ];
  const lines = [header.map(csvEscape).join(',')];

  rows.forEach(r=>{
    const eq = eqById(r.eqId);
    const fails = (r.fails||[]).map(i=>itemsOf(r)[i]).join('؛ ');
    lines.push([
      jDate(r.at),
      jTime(r.at),
      new Date(r.at).toISOString(),
      r.eqCode,
      eq ? eq.name : '',
      eq ? (TYPES[eq.type]?.label || eq.type) : '',
      eq ? (eq.site||'') : '',
      r.operator,
      r.shift || '',
      r.hours == null ? '' : r.hours,
      r.result === 'pass' ? 'سالم' : 'نیازمند تعمیر',
      (r.fails||[]).length,
      fails,
      r.notes || '',
      r.by || ''
    ].map(csvEscape).join(','));
  });

  // BOM برای نمایش صحیح فارسی در اکسل
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inspection-history-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

/* =========================================================
   QR
   ========================================================= */
function inspectUrl(code){
  const u = new URL(location.href);
  u.search = '?eq=' + encodeURIComponent(code);
  u.hash = '';
  return u.toString();
}

function viewQR(){
  const list = DB.equipment.filter(e=>e.active!==false).sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  return `
  <div class="panel">
    <h2>📱 کد QR تجهیزات <span class="sub">${faDigit(list.length)} کارت</span></h2>
    <p class="hint">این کدها را چاپ و روی بدنه هر دستگاه بچسبانید. اپراتور با اسکن کد وارد سامانه می‌شود و مستقیم به فرم بازرسی همان تجهیز می‌رود.</p>
    <div class="print-head">کارت‌های QR بازرسی — لیفتراک و ریچ استاکر</div>
    <div class="qr-grid" id="qr-grid">
      ${list.map(e=>`
        <div class="qr-card">
          <div class="box" data-qr="${esc(inspectUrl(e.code))}"></div>
          <div class="code">${esc(e.code)}</div>
          <div class="nm">${esc(e.name)}<br>${esc(e.site||'')}</div>
        </div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" class="no-print">
      <button class="btn primary" data-act="print">🖨 چاپ کارت‌های QR</button>
    </div>
    <p class="mount">آدرس داخل QR بر اساس دامنه‌ی همین سایت ساخته می‌شود؛ کارت‌ها را از همین آدرس چاپ کنید تا روی موبایل اپراتورها باز شوند.</p>
  </div>`;
}

function drawQRCodes(){
  const boxes = document.querySelectorAll('[data-qr]');
  const hasLib = typeof qrcode === 'function';
  boxes.forEach(box=>{
    const text = box.getAttribute('data-qr');
    if(!hasLib){ box.innerHTML = `<div class="fallback">${esc(text)}</div>`; return; }
    try{
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize:4, margin:2 });
    }catch(err){
      box.innerHTML = `<div class="fallback">${esc(text)}</div>`;
    }
  });
}

/* =========================================================
   رویدادها
   ========================================================= */
document.addEventListener('click', async ev=>{
  const navBtn = ev.target.closest('nav.tabs button');
  if(navBtn){ state.statusFilter = ''; show(navBtn.dataset.view); return; }

  const actEl = ev.target.closest('[data-act]');
  if(!actEl) return;
  const act = actEl.dataset.act;

  if(act==='reload'){ BOOT = { status:'loading', error:'' }; render(); bootstrap(); }
  else if(act==='home'){ state.lastResult = null; show('dashboard'); }
  else if(act==='print'){ window.print(); }
  else if(act==='go-qr'){ show('qr'); }
  else if(act==='go-inspect'){
    const eq = eqByCode(actEl.dataset.code);
    if(eq) show('inspect', eq.id);
  }
  else if(act==='pick-eq'){ show('inspect', actEl.dataset.id); }
  else if(act==='to-test'){ show('test'); }
  else if(act==='filter-eq'){ state.typeFilter = actEl.dataset.type || ''; render(); }
  else if(act==='to-inspect'){ state.inspectEqId = null; show('inspect'); }
  else if(act==='cancel-inspect'){ show('inspect', null); }
  else if(act==='csv'){ downloadHistoryCSV(); }
  else if(act==='del-chk'){
    const id = actEl.dataset.id;
    const item = (DB.checklist||[]).find(c=>c.id===id);
    if(!item) return;
    if(!confirm('آیتم «' + item.label + '» از چک‌لیست حذف شود؟')) return;
    actEl.disabled = true;
    try{
      await api('/api/checklist/' + encodeURIComponent(id), { method:'DELETE' });
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
      actEl.disabled = false;
    }
  }
  else if(act==='save-period'){
    const id = actEl.dataset.id;
    const input = document.getElementById('period-' + id);
    if(!input) return;
    const period = Number(input.value);
    if(!Number.isInteger(period) || period < 1 || period > 365){
      alert('دوره بازرسی باید عددی بین ۱ تا ۳۶۵ روز باشد.');
      return;
    }
    actEl.disabled = true;
    try{
      const siteInput = document.getElementById('site-' + id);
      const site = siteInput ? siteInput.value.trim() : '';
      await api('/api/equipment/' + encodeURIComponent(id), { method:'PATCH', body:{ period, site } });
      const eq = eqById(id);
      if(eq){ eq.period = period; eq.site = site; }
      render();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
      actEl.disabled = false;
    }
  }
  else if(act==='logout'){
    try{ await fetch('/api/logout', { method:'POST', credentials:'same-origin' }); }catch(e){}
    USER = null;
    BOOT = { status:'signedout', error:'' };
    state.view = 'inspect';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  else if(act==='save-logo'){
    const inp = document.getElementById('logo-file');
    const msg = document.getElementById('logo-msg');
    const f = inp && inp.files && inp.files[0];
    if(!f){ msg.innerHTML = `<div class="notice warn">ابتدا یک فایل تصویری انتخاب کنید.</div>`; return; }
    if(f.size > 200000){ msg.innerHTML = `<div class="notice warn">حجم فایل بیشتر از ۲۰۰ کیلوبایت است.</div>`; return; }
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const r = await api('/api/logo', { method:'POST', body:{ dataUrl: String(reader.result) } });
        BOOT.logo = r.logo || '';
        render();
      }catch(e){
        if(e.unauthorized){ render(); return; }
        msg.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
      }
    };
    reader.readAsDataURL(f);
  }
  else if(act==='del-logo'){
    try{
      await api('/api/logo', { method:'POST', body:{ dataUrl:'' } });
      BOOT.logo = '';
      render();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
    }
  }
  else if(act==='toggle-role' || act==='toggle-active'){
    const code = actEl.dataset.code;
    actEl.disabled = true;
    try{
      const body = act==='toggle-role'
        ? { role: actEl.dataset.role }
        : { active: actEl.dataset.active === '1' };
      await api('/api/users/' + encodeURIComponent(code), { method:'PATCH', body });
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
      actEl.disabled = false;
    }
  }
  else if(act==='reset-pass'){
    const code = actEl.dataset.code;
    const pass = prompt('رمز عبور جدید برای کد پرسنلی ' + code + ':', '');
    if(!pass) return;
    if(pass.length < 4){ alert('رمز باید حداقل ۴ نویسه باشد.'); return; }
    actEl.disabled = true;
    try{
      await api('/api/users/' + encodeURIComponent(code), { method:'PATCH', body:{ password: pass } });
      alert('رمز کاربر ' + code + ' تغییر کرد.');
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
      actEl.disabled = false;
    }
  }
  else if(act==='sheet-test'){
    const out = document.getElementById('settings-out');
    if(out) out.innerHTML = `<div class="notice">در حال تست…</div>`;
    try{
      const r = await api('/api/sheet/test');
      if(out) out.innerHTML = `<div class="notice good">اتصال برقرار است — ${faDigit(r.users)} کاربر و ${faDigit(r.inspections)} ردیف بازرسی در شیت.</div>`;
    }catch(e){
      if(e.unauthorized){ render(); return; }
      if(out) out.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
    }
  }
  else if(act==='sheet-sync'){
    const out = document.getElementById('settings-out');
    if(out) out.innerHTML = `<div class="notice">در حال ارسال…</div>`;
    try{
      const r = await api('/api/sheet/sync', { method:'POST' });
      if(out) out.innerHTML = `<div class="notice ${r.error?'warn':'good'}">${faDigit(r.sent)} مورد به شیت ارسال شد.${r.error ? ' خطا: ' + esc(r.error) : ''}</div>`;
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      if(out) out.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
    }
  }
  else if(act==='kpi-go'){
    state.statusFilter = actEl.dataset.status || '';
    state.eqQ = '';
    state.typeFilter = '';
    show(actEl.dataset.view || 'dashboard');
  }
  else if(act==='clear-status'){
    state.statusFilter = '';
    render();
  }
  else if(act==='guide-ok'){
    state.guideOk[actEl.dataset.id] = true;
    render();
    window.scrollTo({top:0});
  }
  else if(act==='eq-guide'){
    const row = document.getElementById('guide-row-' + actEl.dataset.id);
    if(!row) return;
    const open = row.style.display !== 'none';
    row.style.display = open ? 'none' : '';
    if(!open){
      const ta = document.getElementById('guide-' + actEl.dataset.id);
      if(ta){ ta.focus(); if(ta.scrollIntoView) ta.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
  else if(act==='save-type-guide'){
    const t = actEl.dataset.type;
    const ta = document.getElementById('tg-' + t);
    const msg = document.getElementById('tg-msg-' + t);
    actEl.disabled = true;
    if(msg) msg.textContent = 'در حال ذخیره…';
    try{
      const res = await api('/api/guides', { method:'POST', body:{ [t]: ta ? ta.value : '' } });
      DB.guides = Object.assign({}, DB.guides, res.guides || {});
      if(msg) msg.textContent = 'ذخیره شد ✓ روی همه‌ی دستگاه‌های این نوع اعمال شد.';
    }catch(e){
      if(e.unauthorized){ render(); return; }
      if(msg) msg.textContent = e.message;
    }
    actEl.disabled = false;
  }
  else if(act==='save-guide'){
    const id = actEl.dataset.id;
    const ta = document.getElementById('guide-' + id);
    actEl.disabled = true;
    try{
      const res = await api('/api/equipment/' + encodeURIComponent(id), { method:'PATCH', body:{ guide: ta ? ta.value : '' } });
      const eq = eqById(id);
      if(eq) eq.guide = res.guide || '';
      render();
      const again = document.getElementById('guide-row-' + id);
      if(again) again.style.display = 'none';
    }catch(e){
      if(e.unauthorized){ render(); return; }
      const msg = document.getElementById('guide-msg-' + id);
      if(msg) msg.textContent = e.message;
      actEl.disabled = false;
    }
  }
  else if(act==='del-test'){
    if(!confirm('این نتیجه آزمون از داشبورد حذف شود؟')) return;
    actEl.disabled = true;
    try{
      await api('/api/tests/' + encodeURIComponent(actEl.dataset.id), { method:'DELETE' });
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message); actEl.disabled = false;
    }
  }
  else if(act==='del-op'){
    const name = actEl.dataset.name || '';
    if(!confirm('همه‌ی بازرسی‌های ثبت‌شده با نام «' + name + '» حذف شود؟\nاین کار قابل بازگشت نیست.')) return;
    actEl.disabled = true;
    try{
      const res = await api('/api/operators?name=' + encodeURIComponent(name), { method:'DELETE' });
      await bootstrap();
      if(res && typeof res.removed === 'number') console.info('removed', res.removed);
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message); actEl.disabled = false;
    }
  }
  else if(act==='del-visit'){
    if(!confirm('سابقه‌ی ورود و حضور کاربر ' + actEl.dataset.code + ' پاک شود؟')) return;
    actEl.disabled = true;
    try{
      await api('/api/visits?code=' + encodeURIComponent(actEl.dataset.code), { method:'DELETE' });
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message); actEl.disabled = false;
    }
  }
  else if(act==='del-rec'){
    ev.stopPropagation();
    if(!confirm('این بازرسی از تاریخچه حذف شود؟\nاین کار قابل بازگشت نیست.')) return;
    actEl.disabled = true;
    try{
      await api('/api/inspections/' + encodeURIComponent(actEl.dataset.id), { method:'DELETE' });
      state.openRecord = null;
      await bootstrap();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message); actEl.disabled = false;
    }
  }
  else if(act==='toggle-rec'){
    state.openRecord = state.openRecord === actEl.dataset.id ? null : actEl.dataset.id;
    render();
  }
  else if(act==='del-eq'){
    const eq = eqById(actEl.dataset.id);
    if(!eq) return;
    const n = inspectionsOf(eq.id).length;
    if(!confirm(`تجهیز ${eq.code} و ${n} رکورد بازرسی آن از دیتابیس مرکزی حذف شود؟`)) return;
    actEl.disabled = true;
    try{
      await api('/api/equipment/' + encodeURIComponent(eq.id), { method:'DELETE' });
      DB.equipment = DB.equipment.filter(e=>e.id!==eq.id);
      DB.inspections = DB.inspections.filter(i=>i.eqId!==eq.id);
      if(state.inspectEqId===eq.id) state.inspectEqId = null;
      render();
    }catch(e){
      if(e.unauthorized){ render(); return; }
      alert(e.message);
      actEl.disabled = false;
    }
  }
});

document.addEventListener('keydown', ev=>{
  if(ev.key !== 'Enter' && ev.key !== ' ') return;
  const el = ev.target.closest && ev.target.closest('[role="link"][data-act]');
  if(!el) return;
  ev.preventDefault();
  el.click();
});

document.addEventListener('input', ev=>{
  if(ev.target.id==='eq-filter'){
    const val = ev.target.value;
    const pos = ev.target.selectionStart;
    state.eqQ = val;
    state.inspectEqId = null;
    $('#app').innerHTML = viewInspect();
    const f = $('#eq-filter');
    if(f){ f.focus(); f.value = val; try{ f.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  if(ev.target.id==='search'){
    const val = ev.target.value;
    const pos = ev.target.selectionStart;
    state.q = val;
    $('#app').innerHTML = viewDashboard();
    const s = $('#search');
    if(s){ s.focus(); s.value = val; try{ s.setSelectionRange(pos,pos); }catch(e){} }
  }
});

document.addEventListener('submit', async ev=>{
  if(ev.target.id !== 'eq-form') return;
  ev.preventDefault();
  const f = ev.target;
  const msg = $('#eq-msg');
  const val = k => (f.elements[k].value||'').trim();
  const code = val('code').toUpperCase();
  const name = val('name');
  const btn = f.querySelector('button[type=submit]');

  if(!code || !name){
    msg.innerHTML = `<div class="notice warn">کد و نام تجهیز الزامی است.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = 'در حال ثبت…';
  msg.innerHTML = '';
  try{
    const res = await api('/api/equipment', { method:'POST', body:{
      code, name,
      type: f.elements['type'].value,
      model: val('model'),
      capacity: val('capacity'),
      site: val('site'),
      period: Number(f.elements['period'].value) || 30
    }});
    DB.equipment.push(res.equipment);
    state.inspectEqId = null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){
    if(e.unauthorized){ render(); return; }
    msg.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'ثبت تجهیز در دیتابیس مرکزی';
  }
});

document.addEventListener('submit', async ev=>{
  if(ev.target.id !== 'settings-form') return;

  const form = ev.target;
  const url = form.elements['url'].value.trim();
  const token = form.elements['token'].value.trim();

  }

  btn.textContent = 'در حال تست…';
  msg.innerHTML = '';
  try{

    BOOT.sheetUrl = url;
    if(BOOT.status === 'setup'){
      BOOT.status = 'signedout';
      render();
    }else{
      if(out) out.innerHTML = `<div class="notice good">اتصال برقرار است — ${faDigit(r.users)} کاربر و ${faDigit(r.inspections)} ردیف بازرسی در شیت.</div>`;
      btn.disabled = false;
      btn.textContent = 'ذخیره و تست اتصال';
    }
  }catch(e){
    if(e.unauthorized){ render(); return; }
    msg.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'ذخیره و تست اتصال';
  }
});

document.addEventListener('submit', async ev=>{
  if(ev.target.id !== 'test-form') return;
  ev.preventDefault();
  const form = ev.target;
  const qs = (DB.test && DB.test.questions) || [];
  const answers = [];
  const missing = [];
  qs.forEach((q,i)=>{
    const sel = form.querySelector('input[name="q_' + i + '"]:checked');
    if(!sel) missing.push(i+1);
    else answers.push({ id:q.id, choice:Number(sel.value) });
  });
  const msg = document.getElementById('test-msg');
  if(missing.length){
    msg.innerHTML = `<div class="notice warn">${faDigit(missing.length)} سوال بی‌پاسخ است (شماره ${faDigit(missing.slice(0,8).join('، '))}${missing.length>8?' …':''}).</div>`;
    const first = form.querySelector('.test-q:nth-of-type(' + missing[0] + ')');
    scrollToEl(first);
    return;
  }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = 'در حال ثبت…';
  msg.innerHTML = '';
  try{
    const jn = jalaliNow();
    const res = await api('/api/test', { method:'POST', body:{ answers, jm: jn.jm, jy: jn.jy } });
    state.testResult = res.result;
    DB.test.last = res.result;
    DB.test.valid = !!res.valid;
    await bootstrap();
    state.testResult = res.result;
    if(res.valid && state.pendingEq){
      const pending = state.pendingEq;
      state.pendingEq = null;
      show('inspect', pending);
    }else{
      show('test');
    }
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){
    if(e.unauthorized){ render(); return; }
    msg.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'ثبت پاسخ‌ها و مشاهده نتیجه';
  }
});

/* ---------------- ساعت ---------------- */
function tickClock(){
  const el = $('#clock');
  if(!el) return;
  const now = new Date();
  const dateStr = new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now);
  const timeStr = new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(now);
  el.innerHTML = `${dateStr}<br>ساعت ${timeStr}`;
}

/* ---------------- boot ---------------- */
tickClock();
setInterval(tickClock, 30000);

async function init(){
  try{
    const res = await fetch('/api/config', { credentials:'same-origin', headers:{ accept:'application/json' } });
    const cfg = await res.json();
    if(!cfg || !cfg.configured){
      BOOT = { status:'setup', error:'' };
      render();
      return;
    }
    BOOT.configured = true;
  }catch(e){
    BOOT = { status:'error', error:'ارتباط با سرور برقرار نشد.' };
    render();
    return;
  }
  await bootstrap();
}

(function boot(){
  const code = new URLSearchParams(location.search).get('eq');
  if(code){ state.view = 'inspect'; }
  render();
  init().then(()=>{
    if(code){
      const eq = eqByCode(code);
      if(eq){
        state.inspectEqId = eq.id;
        if(!isManager() && !(DB.test && DB.test.valid)){
          // اسکن QR: ابتدا آزمون، بعد بازرسی همین دستگاه
          state.pendingEq = eq.id;
          state.view = 'test';
        }else{
          state.view = 'inspect';
        }
        render();
      }
      else if(BOOT.status === 'ready'){
        $('#app').insertAdjacentHTML('afterbegin',
          `<div class="panel"><div class="notice warn">تجهیزی با کد <b>${esc(code)}</b> پیدا نشد. لطفاً از فهرست زیر انتخاب کنید.</div></div>`);
      }
    }
  });
})();
</script>
